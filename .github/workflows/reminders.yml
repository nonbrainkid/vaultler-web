# Планировщик рассылки напоминаний: Telegram-бот И браузерные веб-пуши (спринты 1.1 и 1.2).
#
# Один тик = один запрос = оба канала. URL остался `/api/telegram/remind`, хотя каналов
# теперь два: это контракт между workflow и роутом, и менять его вместе с секретом значило
# бы получить окно, в котором напоминания не уходят вообще (`docs/api.md`).
#
# ПОЧЕМУ НЕ Vercel Cron: проект на плане Hobby, а там минимальный интервал крона — РАЗ В
# СУТКИ с точностью ±59 минут (docs/deployment.md). Окно "2 часа до рейдера" на суточном
# тике попросту не попадёт в цель. Хуже того, `crons` в vercel.json с интервалом чаще
# суточного не просто не работает — Vercel ОТКАЗЫВАЕТ В ДЕПЛОЕ целиком с ошибкой
# "Hobby accounts are limited to daily cron jobs". Поэтому планировщик — здесь, а не
# в vercel.json, до апгрейда проекта на Pro.
#
# Секрет подставляется ТОЛЬКО из GitHub Secrets, никогда не в тексте workflow — тот же
# принцип, что и для остальных секретов проекта (docs/security.md → аудит секретов).
name: Reminders (Telegram + web push)

on:
  schedule:
    # Раз в 10 минут. GitHub Actions не гарантирует точность тика (под нагрузкой сдвиг
    # 10–20 минут — обычное дело), поэтому идемпотентность рассылки по
    # (identity, lastCrankAt, kind) в lib/telegram-remind.ts — не опция, а обязательное
    # условие: сдвоенный/запоздавший тик не должен прислать игроку одно и то же напоминание
    # дважды. Сам роут выбирает всех, у кого событие наступило в ПРОШЕДШЕМ интервале, а не
    # полагается на то, что его позвали ровно вовремя.
    - cron: "*/10 * * * *"
  # Ручной запуск из вкладки Actions — для проверки без ожидания расписания.
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/telegram/remind
        # Секрет уходит через env, а НЕ подстановкой ${{ }} прямо в текст команды:
        # интерполяция вставляет значение в исходник скрипта до запуска, поэтому секрет
        # оказывается в командной строке процесса (видна другим процессам раннера), а любой
        # спецсимвол внутри него истолковывается шеллом. Через env значение передаётся
        # переменной и в тексте команды не появляется вовсе.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 20 -X POST "https://thevaultler.fun/api/telegram/remind" \
            -H "Authorization: Bearer $CRON_SECRET"
